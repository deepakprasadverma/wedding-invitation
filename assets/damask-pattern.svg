<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <filter id="emboss">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="1" specularExponent="15" lighting-color="#ffffff" result="spec">
        <fePointLight x="-5000" y="-10000" z="20000"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <rect width="120" height="120" fill="#2d4030"/>

  <g fill="none" stroke="#3b523f" stroke-width="1.5" opacity="0.6">
    <!-- Center Damask Leaf Motif -->
    <path d="M 60,20 C 50,35 45,45 45,55 C 45,70 55,80 60,95 C 65,80 75,70 75,55 C 75,45 70,35 60,20 Z"/>
    <path d="M 60,30 L 60,85"/>
    <path d="M 60,45 C 53,42 48,45 46,50"/>
    <path d="M 60,45 C 67,42 72,45 74,50"/>
    <path d="M 60,60 C 53,58 49,62 48,68"/>
    <path d="M 60,60 C 67,58 71,62 72,68"/>

    <!-- Side Acanthus Flourishes -->
    <path d="M 45,55 C 30,50 20,60 22,75 C 24,85 35,88 45,82"/>
    <path d="M 75,55 C 90,50 100,60 98,75 C 96,85 85,88 75,82"/>

    <!-- Corner Motifs -->
    <path d="M 0,0 C 15,10 20,25 15,35"/>
    <path d="M 120,0 C 105,10 100,25 105,35"/>
    <path d="M 0,120 C 15,110 20,95 15,85"/>
    <path d="M 120,120 C 105,110 100,95 105,85"/>

    <circle cx="60" cy="15" r="2.5" fill="#4d6952"/>
    <circle cx="60" cy="100" r="2.5" fill="#4d6952"/>
    <circle cx="20" cy="60" r="2" fill="#4d6952"/>
    <circle cx="100" cy="60" r="2" fill="#4d6952"/>
  </g>
</svg>
