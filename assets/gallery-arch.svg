<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="60%" stop-color="#4a3e4d"/>
      <stop offset="100%" stop-color="#8a5358"/>
    </linearGradient>
    <radialGradient id="fairyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fce2aa"/>
      <stop offset="100%" stop-color="#fce2aa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#twilightBg)"/>

  <!-- Distant Hill & Trees -->
  <path d="M 0,280 Q 200,240 400,270 Q 500,250 600,270 L 600,400 L 0,400 Z" fill="#20222e"/>

  <!-- Grand Circular Floral Arch -->
  <g transform="translate(300, 220)">
    <!-- Gold Ring Structure -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#d4af37" stroke-width="4"/>
    <circle cx="0" cy="0" r="135" fill="none" stroke="#b8860b" stroke-width="1.5"/>

    <!-- Lush Floral Cover on Arch -->
    <!-- Top Floral Cloud -->
    <ellipse cx="0" cy="-140" rx="80" ry="25" fill="#4a5d48"/>
    <circle cx="-35" cy="-145" r="22" fill="#fff9f0"/>
    <circle cx="35" cy="-145" r="22" fill="#fff9f0"/>
    <circle cx="0" cy="-155" r="25" fill="#fce4dc"/>
    <circle cx="-15" cy="-135" r="18" fill="#e29578"/>
    <circle cx="20" cy="-135" r="18" fill="#dfbe82"/>

    <!-- Left Floral Swag -->
    <ellipse cx="-135" cy="-30" rx="30" ry="70" fill="#4a5d48"/>
    <circle cx="-140" cy="-60" r="20" fill="#fff9f0"/>
    <circle cx="-135" cy="-15" r="24" fill="#fce4dc"/>
    <circle cx="-140" cy="30" r="22" fill="#e8c2b7"/>
    <circle cx="-120" cy="0" r="16" fill="#fcedd9"/>

    <!-- Right Floral Swag -->
    <ellipse cx="135" cy="-30" rx="30" ry="70" fill="#4a5d48"/>
    <circle cx="140" cy="-60" r="20" fill="#fff9f0"/>
    <circle cx="135" cy="-15" r="24" fill="#fce4dc"/>
    <circle cx="140" cy="30" r="22" fill="#e8c2b7"/>
    <circle cx="120" cy="0" r="16" fill="#fcedd9"/>

    <!-- Hanging Crystal Beads & Lights -->
    <line x1="-50" y1="-120" x2="-50" y2="20" stroke="#fce2aa" stroke-width="1.5" stroke-dasharray="2,6"/>
    <line x1="-20" y1="-125" x2="-20" y2="50" stroke="#fce2aa" stroke-width="1.5" stroke-dasharray="2,6"/>
    <line x1="20" y1="-125" x2="20" y2="50" stroke="#fce2aa" stroke-width="1.5" stroke-dasharray="2,6"/>
    <line x1="50" y1="-120" x2="50" y2="20" stroke="#fce2aa" stroke-width="1.5" stroke-dasharray="2,6"/>

    <!-- Couple Silhouette Inside Arch -->
    <g transform="translate(-15, 30)" opacity="0.85">
      <!-- Groom -->
      <path d="M 0,0 C 0,-15 15,-15 15,0 L 18,70 L -3,70 Z" fill="#1b1c24"/>
      <circle cx="7" cy="-22" r="9" fill="#1b1c24"/>
      <!-- Bride in Gown with Veil -->
      <path d="M 32,5 C 32,-10 44,-10 44,5 L 58,70 L 18,70 Z" fill="#252431"/>
      <circle cx="38" cy="-18" r="8" fill="#252431"/>
      <!-- Flowing Veil -->
      <path d="M 38,-15 Q 65,15 70,70" stroke="#fdfbf7" stroke-width="1.5" opacity="0.5" fill="none"/>
    </g>
  </g>

  <!-- Ground Flowers & Candle Lanterns -->
  <g transform="translate(140, 340)">
    <!-- Left Glass Lantern -->
    <rect x="0" y="0" width="28" height="45" fill="none" stroke="#d4af37" stroke-width="2"/>
    <polygon points="14,-15 28,0 0,0" fill="#b8860b"/>
    <circle cx="14" cy="25" r="15" fill="url(#fairyGlow)"/>
    <rect x="11" y="20" width="6" height="15" fill="#ffffff"/>
  </g>
  <g transform="translate(430, 340)">
    <!-- Right Glass Lantern -->
    <rect x="0" y="0" width="28" height="45" fill="none" stroke="#d4af37" stroke-width="2"/>
    <polygon points="14,-15 28,0 0,0" fill="#b8860b"/>
    <circle cx="14" cy="25" r="15" fill="url(#fairyGlow)"/>
    <rect x="11" y="20" width="6" height="15" fill="#ffffff"/>
  </g>
</svg>
