<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ringBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4d6150"/>
      <stop offset="60%" stop-color="#2d3f31"/>
      <stop offset="100%" stop-color="#19271c"/>
    </radialGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="25%" stop-color="#eec34d"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="75%" stop-color="#fae498"/>
      <stop offset="100%" stop-color="#8c6411"/>
    </linearGradient>
    <linearGradient id="diamondSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d6f0ff"/>
      <stop offset="100%" stop-color="#a8d8ea"/>
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#ringBg)"/>

  <!-- Velvet Ring Pillow / Box -->
  <ellipse cx="300" cy="270" rx="190" ry="85" fill="#243327" opacity="0.9"/>
  <ellipse cx="300" cy="260" rx="175" ry="75" fill="#364b39"/>
  <ellipse cx="300" cy="255" rx="160" ry="65" fill="#425a47"/>

  <!-- Botanical olive sprigs on pillow -->
  <path d="M 170,260 Q 230,285 270,250" fill="none" stroke="#7e9678" stroke-width="3"/>
  <circle cx="210" cy="270" r="5" fill="#a4b89e"/>
  <circle cx="240" cy="275" r="5" fill="#a4b89e"/>

  <path d="M 430,260 Q 370,285 330,250" fill="none" stroke="#7e9678" stroke-width="3"/>
  <circle cx="390" cy="270" r="5" fill="#a4b89e"/>
  <circle cx="360" cy="275" r="5" fill="#a4b89e"/>

  <!-- Groom's Gold Band (Classic Brushed Gold) -->
  <g transform="translate(260, 200) rotate(-15)">
    <ellipse cx="0" cy="0" rx="55" ry="42" fill="none" stroke="url(#ringGold)" stroke-width="15"/>
    <ellipse cx="0" cy="-2" rx="53" ry="40" fill="none" stroke="#fff0ba" stroke-width="2" opacity="0.8"/>
    <!-- Shadow cast -->
    <ellipse cx="5" cy="40" rx="45" ry="12" fill="#131e15" opacity="0.6"/>
  </g>

  <!-- Bride's Diamond Solitaire Ring -->
  <g transform="translate(340, 190) rotate(18)">
    <ellipse cx="0" cy="0" rx="50" ry="38" fill="none" stroke="url(#ringGold)" stroke-width="12"/>
    <ellipse cx="0" cy="-2" rx="48" ry="36" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <!-- Diamond Setting Crown -->
    <path d="M -12,-38 L 12,-38 L 16,-48 L -16,-48 Z" fill="url(#ringGold)"/>
    <!-- Brilliant Cut Diamond -->
    <polygon points="0,-68 18,-52 14,-46 -14,-46 -18,-52" fill="url(#diamondSparkle)"/>
    <polygon points="0,-68 -18,-52 -6,-52" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,-68 18,-52 6,-52" fill="#cde6f7" opacity="0.9"/>
    <polygon points="0,-68 -6,-52 6,-52" fill="#ffffff"/>
    <!-- Sparkle Stars -->
    <g transform="translate(0, -68)" filter="url(#ringGlow)">
      <path d="M 0,-18 L 0,18 M -18,0 L 18,0" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M -10,-10 L 10,10 M -10,10 L 10,-10" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
