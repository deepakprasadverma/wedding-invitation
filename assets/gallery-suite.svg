<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="suiteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efe9df"/>
      <stop offset="50%" stop-color="#e3dacd"/>
      <stop offset="100%" stop-color="#d6ccbe"/>
    </linearGradient>
    <radialGradient id="waxRed" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d65a50"/>
      <stop offset="60%" stop-color="#992b25"/>
      <stop offset="100%" stop-color="#691612"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#suiteBg)"/>

  <!-- Linen Texture Fabric Underlay -->
  <rect x="50" y="30" width="500" height="340" fill="#faf7f2" rx="6" stroke="#dcd3c4" stroke-width="1.5"/>

  <!-- Envelope (Sage Green / Olive) -->
  <g transform="translate(140, 110) rotate(-6)">
    <!-- Envelope Body -->
    <rect x="0" y="0" width="260" height="170" fill="#3a4f3e" rx="4"/>
    <!-- Flap Fold Lines -->
    <polygon points="0,0 130,90 260,0" fill="#324535" stroke="#253528" stroke-width="1"/>
    <polygon points="0,170 130,85 260,170" fill="#435947" opacity="0.9"/>
    <!-- Gold Foil Liner inside -->
    <polygon points="20,5 130,80 240,5" fill="#d4af37" opacity="0.4"/>
  </g>

  <!-- Luxury Invitation Card -->
  <g transform="translate(230, 70) rotate(4)">
    <!-- Card Base with Gold Beveled Edge -->
    <rect x="0" y="0" width="220" height="290" fill="#fffdfa" rx="4" stroke="#d4af37" stroke-width="2.5"/>
    <rect x="10" y="10" width="200" height="270" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Gold Monogram Crest on Card -->
    <circle cx="110" cy="55" r="22" fill="none" stroke="#aa7c11" stroke-width="1.5"/>
    <text x="110" y="62" font-family="'Cinzel', serif" font-size="18" font-weight="bold" fill="#aa7c11" text-anchor="middle">D &amp; D</text>

    <!-- Calligraphy Placeholder Lines -->
    <text x="110" y="110" font-family="'Great Vibes', cursive" font-size="20" fill="#5c4d3c" text-anchor="middle">Wedding Invitation</text>
    <line x1="40" y1="130" x2="180" y2="130" stroke="#d4c2a5" stroke-width="1.5"/>
    <line x1="55" y1="145" x2="165" y2="145" stroke="#d4c2a5" stroke-width="1.5"/>
    <line x1="70" y1="160" x2="150" y2="160" stroke="#d4c2a5" stroke-width="1.5"/>

    <!-- Date on card -->
    <text x="110" y="200" font-family="'Cinzel', serif" font-size="14" letter-spacing="2" fill="#aa7c11" text-anchor="middle">JANUARY 3</text>
    <text x="110" y="220" font-family="'Montserrat', sans-serif" font-size="11" letter-spacing="3" fill="#666666" text-anchor="middle">2027</text>
  </g>

  <!-- Wax Seal with Stamp -->
  <g transform="translate(265, 230)">
    <!-- Wax puddle -->
    <ellipse cx="0" cy="0" rx="32" ry="30" fill="url(#waxRed)"/>
    <circle cx="-15" cy="-12" r="14" fill="url(#waxRed)"/>
    <circle cx="16" cy="14" r="12" fill="url(#waxRed)"/>
    <!-- Stamp Rim & Monogram -->
    <circle cx="0" cy="0" r="22" fill="#881e18" stroke="#aa3029" stroke-width="2"/>
    <text x="0" y="8" font-family="'Cinzel', serif" font-size="20" font-weight="bold" fill="#f5c2bc" text-anchor="middle">D</text>
  </g>

  <!-- Sprig of Dried Wheat / Eucalyptus Branch -->
  <g transform="translate(100, 240) rotate(-40)">
    <path d="M 0,0 Q 40,-30 120,-20" stroke="#b09b7c" stroke-width="2.5" fill="none"/>
    <ellipse cx="30" cy="-20" rx="10" ry="5" fill="#c4b497" transform="rotate(25 30 -20)"/>
    <ellipse cx="60" cy="-28" rx="10" ry="5" fill="#c4b497" transform="rotate(-20 60 -28)"/>
    <ellipse cx="90" cy="-25" rx="10" ry="5" fill="#c4b497" transform="rotate(30 90 -25)"/>
  </g>
</svg>
