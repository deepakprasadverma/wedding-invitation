<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="70%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#eddcc6"/>
    </linearGradient>
    <linearGradient id="palaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d8c3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d9c3a7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldDrape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="25%" stop-color="#f9e8a2"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="75%" stop-color="#e6ca65"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfe3ec"/>
      <stop offset="50%" stop-color="#89c7d6"/>
      <stop offset="100%" stop-color="#6ba9b8"/>
    </linearGradient>
    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eae2d5"/>
      <stop offset="50%" stop-color="#faf6f0"/>
      <stop offset="100%" stop-color="#dfd5c4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky / Terrace Background -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Distant Palace Colonnade & Domes -->
  <g opacity="0.45">
    <!-- Center Dome -->
    <path d="M 360,180 Q 400,120 440,180 Z" fill="url(#palaceGrad)"/>
    <rect x="396" y="105" width="8" height="20" fill="#b8860b"/>
    <circle cx="400" cy="100" r="5" fill="#d4af37"/>

    <!-- Side Domes -->
    <path d="M 220,200 Q 250,150 280,200 Z" fill="url(#palaceGrad)"/>
    <path d="M 520,200 Q 550,150 580,200 Z" fill="url(#palaceGrad)"/>

    <!-- Distant Arches -->
    <path d="M 150,260 L 150,210 Q 180,180 210,210 L 210,260 Z" fill="none" stroke="#d4c2a5" stroke-width="3"/>
    <path d="M 230,260 L 230,210 Q 260,180 290,210 L 290,260 Z" fill="none" stroke="#d4c2a5" stroke-width="3"/>
    <path d="M 310,260 L 310,200 Q 355,160 400,160 Q 445,160 490,200 L 490,260 Z" fill="none" stroke="#c8b292" stroke-width="3"/>
    <path d="M 510,260 L 510,210 Q 540,180 570,210 L 570,260 Z" fill="none" stroke="#d4c2a5" stroke-width="3"/>
    <path d="M 590,260 L 590,210 Q 620,180 650,210 L 650,260 Z" fill="none" stroke="#d4c2a5" stroke-width="3"/>

    <!-- Cypress Trees -->
    <path d="M 120,260 Q 110,200 120,160 Q 130,200 120,260 Z" fill="#7d9178"/>
    <path d="M 680,260 Q 670,200 680,160 Q 690,200 680,260 Z" fill="#7d9178"/>
  </g>

  <!-- Palace Balustrade Terrace -->
  <rect x="0" y="270" width="800" height="230" fill="#f4ece1"/>
  <!-- Marble Pattern Lines -->
  <line x1="0" y1="270" x2="800" y2="270" stroke="#d4af37" stroke-width="3"/>
  <line x1="0" y1="275" x2="800" y2="275" stroke="#e0cca5" stroke-width="1"/>
  
  <!-- Perspective Terrace Tiles -->
  <path d="M 0,500 L 220,275 M 160,500 L 280,275 M 320,500 L 360,275 M 480,500 L 440,275 M 640,500 L 520,275 M 800,500 L 580,275" stroke="#eedec7" stroke-width="1.5"/>

  <!-- Ornate Central Fountain -->
  <g id="fountain" transform="translate(0, 10)">
    <!-- Base Basin (Octagonal / Oval) -->
    <ellipse cx="400" cy="385" rx="140" ry="38" fill="url(#marbleGrad)" stroke="#cbb28d" stroke-width="3"/>
    <ellipse cx="400" cy="382" rx="130" ry="32" fill="url(#waterGrad)"/>
    
    <!-- Water Ripples -->
    <ellipse cx="400" cy="382" rx="90" ry="18" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="400" cy="382" rx="55" ry="10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

    <!-- Middle Pedestal -->
    <path d="M 380,380 L 385,320 L 415,320 L 420,380 Z" fill="url(#marbleGrad)" stroke="#b8976b" stroke-width="1.5"/>
    <ellipse cx="400" cy="320" rx="30" ry="8" fill="url(#marbleGrad)" stroke="#b8976b" stroke-width="2"/>

    <!-- Tier 2 Basin -->
    <ellipse cx="400" cy="318" rx="65" ry="16" fill="url(#marbleGrad)" stroke="#b8976b" stroke-width="2"/>
    <ellipse cx="400" cy="316" rx="58" ry="13" fill="url(#waterGrad)"/>
    <ellipse cx="400" cy="316" rx="35" ry="7" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>

    <!-- Top Spout Pedestal -->
    <path d="M 392,315 L 394,275 L 406,275 L 408,315 Z" fill="url(#marbleGrad)" stroke="#b8976b" stroke-width="1.5"/>
    <circle cx="400" cy="272" r="8" fill="url(#goldDrape)"/>

    <!-- Water Jet Spray -->
    <path d="M 400,270 Q 380,225 365,300 M 400,270 Q 420,225 435,300 M 400,270 Q 390,215 392,310 M 400,270 Q 410,215 408,310" 
          fill="none" stroke="#e0f4f7" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 400,270 Q 355,235 340,360 M 400,270 Q 445,235 460,360" 
          fill="none" stroke="#e0f4f7" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

    <!-- Water Drops Shimmer -->
    <circle cx="370" cy="245" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="430" cy="245" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="390" cy="230" r="2.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="410" cy="230" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Floral Garland & Rose Urns Surrounding Fountain -->
  <!-- Left Floral Urn -->
  <g transform="translate(190, 310)">
    <path d="M 10,60 L 15,35 L 35,35 L 40,60 Z" fill="#d9c3a7" stroke="#b8976b" stroke-width="1.5"/>
    <ellipse cx="25" cy="35" rx="16" ry="6" fill="#eae2d5"/>
    <!-- Foliage & Flowers -->
    <circle cx="20" cy="25" r="14" fill="#6d8368"/>
    <circle cx="35" cy="28" r="12" fill="#5c7357"/>
    <circle cx="26" cy="18" r="13" fill="#7a9374"/>
    <!-- Roses -->
    <circle cx="24" cy="24" r="7" fill="#f7dcdb"/>
    <circle cx="24" cy="24" r="5" fill="#e89895"/>
    <circle cx="33" cy="20" r="6" fill="#fcf6ea"/>
    <circle cx="33" cy="20" r="4" fill="#dfbe82"/>
    <circle cx="16" cy="18" r="5.5" fill="#ffffff"/>
    <circle cx="16" cy="18" r="3.5" fill="#e6b8a2"/>
  </g>

  <!-- Right Floral Urn -->
  <g transform="translate(560, 310)">
    <path d="M 10,60 L 15,35 L 35,35 L 40,60 Z" fill="#d9c3a7" stroke="#b8976b" stroke-width="1.5"/>
    <ellipse cx="25" cy="35" rx="16" ry="6" fill="#eae2d5"/>
    <!-- Foliage & Flowers -->
    <circle cx="20" cy="25" r="14" fill="#6d8368"/>
    <circle cx="35" cy="28" r="12" fill="#5c7357"/>
    <circle cx="26" cy="18" r="13" fill="#7a9374"/>
    <!-- Roses -->
    <circle cx="24" cy="24" r="7" fill="#f7dcdb"/>
    <circle cx="24" cy="24" r="5" fill="#e89895"/>
    <circle cx="15" cy="22" r="6" fill="#fcf6ea"/>
    <circle cx="15" cy="22" r="4" fill="#dfbe82"/>
    <circle cx="32" cy="18" r="5.5" fill="#ffffff"/>
    <circle cx="32" cy="18" r="3.5" fill="#e6b8a2"/>
  </g>

  <!-- Foreground Garland Swags along the bottom -->
  <path d="M 120,440 Q 260,470 400,440 Q 540,470 680,440" fill="none" stroke="#688062" stroke-width="8" stroke-linecap="round"/>
  <path d="M 130,440 Q 260,465 400,438 Q 540,465 670,440" fill="none" stroke="#7e9678" stroke-width="4"/>
  <!-- Roses dotted along garland -->
  <circle cx="220" cy="452" r="8" fill="#f6d5cf"/>
  <circle cx="220" cy="452" r="5" fill="#d47f7b"/>
  <circle cx="310" cy="454" r="8" fill="#fff7e6"/>
  <circle cx="310" cy="454" r="5" fill="#d4af37"/>
  <circle cx="400" cy="442" r="9" fill="#f7e1d7"/>
  <circle cx="400" cy="442" r="6" fill="#e29578"/>
  <circle cx="490" cy="454" r="8" fill="#fff7e6"/>
  <circle cx="490" cy="454" r="5" fill="#d4af37"/>
  <circle cx="580" cy="452" r="8" fill="#f6d5cf"/>
  <circle cx="580" cy="452" r="5" fill="#d47f7b"/>

  <!-- Royal Silk Valance / Top Drapery Arch -->
  <g id="valanceDrapes">
    <!-- Center Scalloped Swags -->
    <path d="M 0,0 L 0,80 Q 100,120 200,50 Q 300,130 400,50 Q 500,130 600,50 Q 700,120 800,80 L 800,0 Z" 
          fill="#f6efe2" stroke="#d4af37" stroke-width="2.5"/>
    <!-- Fold Shading -->
    <path d="M 0,0 L 0,70 Q 100,105 200,45 Q 300,115 400,45 Q 500,115 600,45 Q 700,105 800,70 L 800,0 Z" 
          fill="#ece0cf" opacity="0.6"/>

    <!-- Gold Fringe along Drapery -->
    <path d="M 0,80 Q 100,120 200,50 Q 300,130 400,50 Q 500,130 600,50 Q 700,120 800,80" 
          fill="none" stroke="url(#goldDrape)" stroke-width="4"/>

    <!-- Golden Tassels hanging at nodes -->
    <g transform="translate(200, 50)">
      <circle cx="0" cy="4" r="4" fill="url(#goldDrape)"/>
      <path d="M -4,6 L 4,6 L 6,24 L -6,24 Z" fill="url(#goldDrape)"/>
    </g>
    <g transform="translate(400, 50)">
      <circle cx="0" cy="4" r="4" fill="url(#goldDrape)"/>
      <path d="M -4,6 L 4,6 L 6,28 L -6,28 Z" fill="url(#goldDrape)"/>
    </g>
    <g transform="translate(600, 50)">
      <circle cx="0" cy="4" r="4" fill="url(#goldDrape)"/>
      <path d="M -4,6 L 4,6 L 6,24 L -6,24 Z" fill="url(#goldDrape)"/>
    </g>

    <!-- Left & Right Royal Side Drapes -->
    <!-- Left Drape -->
    <path d="M 0,0 L 70,0 Q 80,180 30,360 L 0,380 Z" fill="#f4ecdc" stroke="#d4af37" stroke-width="2"/>
    <path d="M 0,0 L 50,0 Q 60,170 20,340 L 0,360 Z" fill="#e8dac4" opacity="0.7"/>
    <!-- Left Tieback -->
    <ellipse cx="45" cy="200" rx="14" ry="7" fill="url(#goldDrape)"/>
    <circle cx="45" cy="208" r="4" fill="url(#goldDrape)"/>
    <path d="M 43,212 L 47,212 L 48,228 L 42,228 Z" fill="url(#goldDrape)"/>

    <!-- Right Drape -->
    <path d="M 800,0 L 730,0 Q 720,180 770,360 L 800,380 Z" fill="#f4ecdc" stroke="#d4af37" stroke-width="2"/>
    <path d="M 800,0 L 750,0 Q 740,170 780,340 L 800,360 Z" fill="#e8dac4" opacity="0.7"/>
    <!-- Right Tieback -->
    <ellipse cx="755" cy="200" rx="14" ry="7" fill="url(#goldDrape)"/>
    <circle cx="755" cy="208" r="4" fill="url(#goldDrape)"/>
    <path d="M 753,212 L 757,212 L 758,228 L 752,228 Z" fill="url(#goldDrape)"/>
  </g>
</svg>
